<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0008;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#2a0018;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#5a0030;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8a1050;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E93D91;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#E93D91;stop-opacity:0"/>
    </linearGradient>
    <pattern id="fabric" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="40" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
      <line x1="40" y1="0" x2="0" y2="40" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <!-- Fond principal -->
  <rect width="1920" height="1080" fill="url(#bg1)"/>
  <!-- Motif textile -->
  <rect width="1920" height="1080" fill="url(#fabric)"/>
  <!-- Halo lumineux gauche -->
  <ellipse cx="300" cy="540" rx="500" ry="400" fill="#E93D91" fill-opacity="0.08"/>
  <!-- Halo lumineux droite -->
  <ellipse cx="1600" cy="300" rx="350" ry="300" fill="#CEA060" fill-opacity="0.07"/>
  <!-- Silhouette décorative — robe longue élégante -->
  <g opacity="0.12" transform="translate(1400,80)">
    <!-- Tête -->
    <ellipse cx="100" cy="80" rx="40" ry="48" fill="#CEA060"/>
    <!-- Corps robe longue -->
    <path d="M60,128 Q40,180 30,280 Q20,400 25,600 Q28,720 40,900 L160,900 Q172,720 175,600 Q180,400 170,280 Q160,180 140,128 Z" fill="#CEA060"/>
    <!-- Voile -->
    <path d="M40,100 Q0,200 10,350 Q5,200 60,128 Z" fill="#CEA060" opacity="0.7"/>
    <path d="M160,100 Q200,200 190,350 Q195,200 140,128 Z" fill="#CEA060" opacity="0.7"/>
  </g>
  <!-- Second silhouette -->
  <g opacity="0.07" transform="translate(200,150) scale(0.8)">
    <ellipse cx="100" cy="80" rx="40" ry="48" fill="#E93D91"/>
    <path d="M60,128 Q40,180 30,280 Q20,400 25,600 Q28,720 40,900 L160,900 Q172,720 175,600 Q180,400 170,280 Q160,180 140,128 Z" fill="#E93D91"/>
  </g>
  <!-- Ligne dorée horizontale décorative -->
  <line x1="600" y1="540" x2="1320" y2="540" stroke="#CEA060" stroke-width="0.5" opacity="0.3"/>
  <!-- Cercles décoratifs -->
  <circle cx="960" cy="540" r="200" fill="none" stroke="#CEA060" stroke-width="0.5" opacity="0.2"/>
  <circle cx="960" cy="540" r="280" fill="none" stroke="#CEA060" stroke-width="0.3" opacity="0.1"/>
  <!-- Texte watermark discret -->
  <text x="960" y="1040" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#CEA060" fill-opacity="0.25" letter-spacing="6">SHE&apos;S FIT &amp; BEAUTY</text>
  <!-- Indication remplacement -->
  <text x="960" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.2)">[ Remplacez par votre photo — Slide 1 ]</text>
</svg>
